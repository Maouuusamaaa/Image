<g transform="translate(90 220)"><use href="#body"/><path d="M0 0 L-12 42 L-20 65 M0 0 L12 42 L20 65" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="-58" y1="70" x2="58" y2="70" stroke="#cbd5e1" stroke-width="2"/><text x="0" y="105" font-size="15" fill="#172033">1 · Start</text></g><g transform="translate(270 220)"><use href="#body"/><path d="M0 0 L-12 42 L-22 63 M0 0 L16 27 L33 48" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="-58" y1="70" x2="58" y2="70" stroke="#cbd5e1" stroke-width="2"/><text x="0" y="105" font-size="15" fill="#172033">2 · Lift right</text></g><g transform="translate(450 220)"><use href="#body"/><path d="M0 0 L-14 35 L-28 57 M0 0 L20 32 L37 48" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="-58" y1="70" x2="58" y2="70" stroke="#cbd5e1" stroke-width="2"/><text x="0" y="105" font-size="15" fill="#172033">3 · Right forward</text></g><g transform="translate(630 220)"><use href="#body"/><path d="M0 0 L-8 30 L-20 52 M0 0 L9 31 L18 53" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="-58" y1="70" x2="58" y2="70" stroke="#cbd5e1" stroke-width="2"/><text x="0" y="105" font-size="15" fill="#172033">4 · Pass</text></g><g transform="translate(810 220)"><use href="#body"/><path d="M0 0 L-20 32 L-37 48 M0 0 L14 35 L28 57" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="-58" y1="70" x2="58" y2="70" stroke="#cbd5e1" stroke-width="2"/><text x="0" y="105" font-size="15" fill="#172033">5 · Left forward</text></g><g transform="translate(990 220)"><use href="#body"/><path d="M0 0 L-16 27 L-33 48 M0 0 L12 42 L22 63" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="-58" y1="70" x2="58" y2="70" stroke="#cbd5e1" stroke-width="2"/><text x="0" y="105" font-size="15" fill="#172033">6 · Lift left</text></g><g transform="translate(1170 220)"><use href="#body"/><path d="M0 0 L-20 32 L-37 48 M0 0 L14 35 L28 57" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="-58" y1="70" x2="58" y2="70" stroke="#cbd5e1" stroke-width="2"/><text x="0" y="105" font-size="15" fill="#172033">7 · Right back</text></g><g transform="translate(1350 220)"><use href="#body"/><path d="M0 0 L-12 42 L-20 65 M0 0 L12 42 L20 65" fill="none" stroke="#111827" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><line x1="-58" y1="70" x2="58" y2="70" stroke="#cbd5e1" stroke-width="2"/><text x="0" y="105" font-size="15" fill="#172033">8 · Loop</text></g></g><text x="36" y="460" font-family="Arial,sans-serif" font-size="15" fill="#475569">Rig notes: hands stay behind the head; elbows point outward. Alternate foot lift and forward placement; keep torso/head stable with subtle vertical bob.</text><text x="36" y="486" font-family="Arial,sans-serif" font-size="14" fill="#64748b">Reference guide only: each key pose should be interpolated into intermediate frames and checked against foot sliding, limb continuity, and loop closure.</text></svg>
name: Build Static Routing MikroTik Poster

on:
  push:
    branches: [main]
    paths:
      - "static-routing-mikrotik/source/**"
      - "static-routing-mikrotik/scripts/**"
      - ".github/workflows/build-static-routing-poster.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install renderer
        run: python -m pip install --upgrade pip cairosvg
      - name: Render PNG and PDF from SVG master
        run: python static-routing-mikrotik/scripts/build_poster.py
      - name: Validate generated files
        run: |
          test -s static-routing-mikrotik/output/static-routing-mikrotik.png
          test -s static-routing-mikrotik/output/static-routing-mikrotik.pdf
          file static-routing-mikrotik/output/static-routing-mikrotik.png static-routing-mikrotik/output/static-routing-mikrotik.pdf
      - name: Commit rendered deliverables
        run: |
          if git diff --quiet -- static-routing-mikrotik/output/static-routing-mikrotik.png static-routing-mikrotik/output/static-routing-mikrotik.pdf; then
            echo "Rendered files are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static-routing-mikrotik/output/static-routing-mikrotik.png static-routing-mikrotik/output/static-routing-mikrotik.pdf
          git commit -m "Build Static Routing MikroTik poster outputs"
          git push

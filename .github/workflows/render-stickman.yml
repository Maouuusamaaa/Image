name: Render Stickman Battle

on:
  push:
    branches: [main]
    paths:
      - 'animation/src/**'
      - 'animation/tests/**'
      - 'animation/scripts/**'
      - 'animation/references/**'
      - 'animation/requirements.txt'
      - '.github/workflows/render-stickman.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-and-render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install -r animation/requirements.txt
      - name: Run tests
        working-directory: animation
        run: python -m unittest discover -s tests -v
      - name: Render battle MP4
        working-directory: animation
        run: python src/render_battle.py --output output/stickman-battle-v1.mp4
      - name: Render reference walk MP4
        working-directory: animation
        run: python src/render_walk.py --output output/stickman-walk-hands-behind-head.mp4
      - name: Create contact sheet
        working-directory: animation
        run: python scripts/make_contact_sheet.py
      - name: Commit generated deliverables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add animation/output/stickman-battle-v1.mp4 animation/output/stickman-walk-hands-behind-head.mp4 animation/output/contact-sheet.png
          if git diff --cached --quiet; then
            echo "Generated outputs are unchanged."
          else
            git commit -m "Render stickman animation outputs"
            git push
          fi
